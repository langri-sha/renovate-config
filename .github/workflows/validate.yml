name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  preset:
    name: Renovate preset
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup PNPM
        uses: langri-sha/github/actions/pnpm@v0.37.1

      - name: Validate the preset
        run: pnpm exec renovate-config-validator --strict default.json

      - name: Require a real change file for preset changes
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --name-only HEAD^1 HEAD | grep -qx default.json; then
            exit 0
          fi

          while IFS= read -r file; do
            if awk '/^---$/ { fences++; next } fences >= 2' "$file" | grep -q '[^[:space:]]'; then
              exit 0
            fi
          done < <(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- '.changeset/*.md' ':!.changeset/README.md')

          echo '::error::default.json changed, so the pull request needs a change file with a description (pnpm changeset). An empty one releases nothing and does not count.'
          exit 1
